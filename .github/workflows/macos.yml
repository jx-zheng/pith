name: macOS checks

on:
  push:
    paths:
      - "App/**"
      - "Tests/PithWindowTests/**"
      - "Sources/PithCore/IconRingGeometry.swift"
      - "Tests/PithCoreTests/IconRingGeometryTests.swift"
      - "project.yml"
      - "Package.swift"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "App/**"
      - "Tests/PithWindowTests/**"
      - "Sources/PithCore/IconRingGeometry.swift"
      - "Tests/PithCoreTests/IconRingGeometryTests.swift"
      - "project.yml"
      - "Package.swift"
      - ".github/workflows/macos.yml"

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  window-tests:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Title-bar drag tests
        run: |
          xcodebuild test \
            -project Pith.xcodeproj \
            -scheme Pith \
            -destination 'platform=macOS' \
            -only-testing:PithWindowTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            ENABLE_HARDENED_RUNTIME=NO
